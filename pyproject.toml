[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minicpm-tool-call-adapter"
version = "0.1.0"
description = "Minimal MiniCPM5 tool-call proxy for llama.cpp"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[project.scripts]
minicpm5-adapter = "minicpm_tool_call_adapter.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
